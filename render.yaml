# Despliegue en Render. Las variables con sync: false se piden al crear el Blueprint.
services:
  - type: web
    name: ergopostura
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    healthCheckPath: /ingresar/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ergopostura-db
          property: connectionString
      - key: DJANGO_ADMIN_EMAIL
        sync: false
      - key: DJANGO_ADMIN_PASSWORD
        sync: false
      # Opcional: si se define, crea las cuentas y datos ficticios de demostración.
      - key: DEMO_SEED_PASSWORD
        sync: false

databases:
  - name: ergopostura-db
    plan: free
    region: virginia
