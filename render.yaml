# Despliegue en Render. Las variables con sync: false se piden al crear el Blueprint.
services:
  - type: web
    name: ergopostura
    runtime: docker
    plan: free
    region: virginia
    dockerfilePath: ./Dockerfile
    healthCheckPath: /ingresar/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_SECRET_KEY
        generateValue: true
      # MySQL externo (Aiven): la Service URI, que incluye la contraseña.
      - key: DATABASE_URL
        sync: false
      - key: DJANGO_ADMIN_EMAIL
        sync: false
      - key: DJANGO_ADMIN_PASSWORD
        sync: false
      # Opcional: activa la lectura de contratos con IA (Claude). Sin ella, los contratos
      # funcionan pero sin resumen automático.
      - key: ANTHROPIC_API_KEY
        sync: false
