{% if page_obj %}
<div class="pagination">
  <span>Mostrando {{ page_obj.start_index }}–{{ page_obj.end_index }} de {{ page_obj.paginator.count }} {{ noun }}</span>
  <div>
    {% if page_obj.has_previous %}
      <a class="btn btn-secondary" href="?page={{ page_obj.previous_page_number }}{% if query %}&amp;q={{ query|urlencode }}{% endif %}{{ extra_query }}">Anterior</a>
    {% else %}
      <button class="btn btn-secondary" disabled>Anterior</button>
    {% endif %}
    {% if page_obj.has_next %}
      <a class="btn btn-secondary" href="?page={{ page_obj.next_page_number }}{% if query %}&amp;q={{ query|urlencode }}{% endif %}{{ extra_query }}">Siguiente</a>
    {% else %}
      <button class="btn btn-secondary" disabled>Siguiente</button>
    {% endif %}
  </div>
</div>
{% endif %}
