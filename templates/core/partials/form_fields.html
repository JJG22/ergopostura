{% load ui %}
<div class="form-grid {{ form.grid_class }}">
  {% for field in form.visible_fields %}
    {% if field.widget_type == 'checkbox' %}
      <label class="remember field-check">{{ field }} <span>{{ field.label }}</span></label>
    {% else %}
      <div class="field field--{{ field.widget_type }}{% if field.errors %} has-error{% endif %}">
        <label for="{{ field.id_for_label }}">{{ field.label|capfirst }}{% if not field.field.required %} (opcional){% endif %}</label>
        {{ field }}
        {% if field.help_text %}<small>{{ field.help_text }}</small>{% endif %}
        {% for error in field.errors %}
          <small class="error-text" role="alert">{% icon 'circle-exclamation-point' %} {{ error }}</small>
        {% endfor %}
      </div>
    {% endif %}
  {% endfor %}
</div>
