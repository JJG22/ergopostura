{% load ui %}
<div class="overlay">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="modal-head">
      <h2 class="title title-2" id="modal-title">{{ title }}</h2>
      <button type="button" class="icon-btn" data-modal-close aria-label="Cerrar">{% icon 'x' %}</button>
    </div>
    <form method="post" action="{{ request.get_full_path }}" hx-post="{{ request.get_full_path }}" hx-target="#modal-root" hx-swap="innerHTML" novalidate>
      {% include "core/partials/form_body.html" %}
    </form>
  </div>
</div>
