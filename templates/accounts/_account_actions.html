{% load ui %}
<div class="row-actions">
  <a class="btn btn-tertiary" href="{% url 'accounts:user_update' account.pk %}" hx-get="{% url 'accounts:user_update' account.pk %}" hx-target="#modal-root" hx-swap="innerHTML" title="Editar datos">{% icon 'pencil' %}<span class="sr-only">Editar {{ account.email }}</span></a>
  {% if account.pk != request.user.pk %}
    <a class="btn btn-tertiary" href="{% url 'accounts:user_password' account.pk %}" hx-get="{% url 'accounts:user_password' account.pk %}" hx-target="#modal-root" hx-swap="innerHTML" title="Asignar contraseña temporal">{% icon 'key-round' %}<span class="sr-only">Contraseña de {{ account.email }}</span></a>
    <form method="post" action="{% url 'accounts:user_toggle' account.pk %}"{% if account.is_active %} data-confirm="¿Desactivar la cuenta de {{ account.email }}? No podrá ingresar hasta que la actives de nuevo."{% endif %}>
      {% csrf_token %}
      {% if account.is_active %}
        <button type="submit" class="btn btn-tertiary btn-tertiary-danger" title="Desactivar">{% icon 'ban' %}<span class="sr-only">Desactivar {{ account.email }}</span></button>
      {% else %}
        <button type="submit" class="btn btn-tertiary" title="Activar">{% icon 'check' %}<span class="sr-only">Activar {{ account.email }}</span></button>
      {% endif %}
    </form>
  {% endif %}
</div>
