services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql-init.sh:/docker-entrypoint-initdb.d/10-permisos-pruebas.sh:ro
    ports:
      # Para MySQL Workbench. Puerto 3307 para no chocar con otro MySQL instalado en el equipo.
      - "127.0.0.1:3307:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: "3306"
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy

  # Cliente React en desarrollo: http://localhost:5173/app/ (recarga al guardar).
  frontend:
    image: node:22-alpine
    working_dir: /web
    command: sh -c "npm ci --no-audit --no-fund && npm run dev"
    environment:
      VITE_PROXY_TARGET: http://web:8000
    volumes:
      - ./frontend:/web
      - node_modules:/web/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      - web

volumes:
  mysql_data:
  node_modules:
